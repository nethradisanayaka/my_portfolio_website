[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Poppler provides `pdftoppm`, used by scripts/generate-education-previews.mjs
# to render the first-page previews for the education PDFs.
[[build.apt]]
  package = "poppler-utils"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Static documents are served straight from the publish directory.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
